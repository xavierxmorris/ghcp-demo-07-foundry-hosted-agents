# Prepares the environment for the GitHub Copilot coding agent.
#
# The job name MUST be `copilot-setup-steps` -- that is how Copilot finds it.
# Everything installed here is available to the agent before it starts working,
# which is what lets it run `pytest` and verify its own changes.
#
# See docs/09-coding-agent.md
name: copilot-setup-steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-dev.txt
      - 'src/*/requirements.txt'
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-dev.txt
      - 'src/*/requirements.txt'

concurrency:
  group: copilot-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/*/requirements.txt

      # Dev tooling: this is what gives the agent a fast, honest test signal.
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # Agent runtime dependencies, so the agent can reason about real imports
      # rather than guessing at the agent_framework API surface.
      - name: Install agent runtime dependencies
        run: |
          for service in devops-triage docs-qa; do
            python -m venv "src/$service/.venv"
            "src/$service/.venv/bin/python" -m pip install -r "src/$service/requirements.txt"
            "src/$service/.venv/bin/python" -m pip check
          done

      # azd + Foundry extensions so the agent can read `azd ai agent --help`
      # and validate azure.yaml. It cannot deploy -- there are no credentials
      # in this environment, which is deliberate.
      - name: Install azd
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: '1.33.0'

      - name: Install Foundry extensions
        run: |
          azd version
          azd extension install microsoft.foundry --no-prompt
          azd ai agent --help

      - name: Verify the test suite runs
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q

      - name: Verify the linter runs
        run: ruff check src tests scripts

      - name: Validate deployment inputs offline
        run: python scripts/validate_ci.py
