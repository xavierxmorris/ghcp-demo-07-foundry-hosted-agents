name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # No Azure credentials needed: the agents' domain logic imports nothing
      # from the agent framework or the Azure SDKs. That is the whole point of
      # the layering rule -- see docs/architecture.md.
      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

  validate-manifest:
    name: Validate azure.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: pip install pyyaml

      - name: Every agent service must have a real entry point
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          manifest = yaml.safe_load(pathlib.Path("azure.yaml").read_text(encoding="utf-8"))
          services = manifest.get("services", {})

          agents = {
              name: svc
              for name, svc in services.items()
              if svc.get("host") == "azure.ai.agent"
          }
          if not agents:
              sys.exit("no azure.ai.agent services found in azure.yaml")

          failed = False
          for name, svc in agents.items():
              project = svc.get("project")
              entry = (svc.get("codeConfiguration") or {}).get("entryPoint")
              if not project or not entry:
                  print(f"{name}: missing project or codeConfiguration.entryPoint")
                  failed = True
                  continue

              path = pathlib.Path(project) / entry
              ok = path.is_file()
              print(f"{name}: {path} [{'ok' if ok else 'MISSING'}]")
              failed |= not ok

              # An agent with no model binding deploys but cannot answer.
              if "ai-project" not in (svc.get("uses") or []):
                  print(f"{name}: does not declare `uses: [ai-project]`")
                  failed = True

          sys.exit("azure.yaml validation failed" if failed else 0)
          PY

  eval-datasets:
    name: Validate eval datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every dataset row is valid JSON with the required fields
        run: |
          python - <<'PY'
          import json, pathlib, sys

          required = {"id", "description", "query", "candidate_response"}
          failed = False

          for path in sorted(pathlib.Path("src").glob("*/datasets/*/*.jsonl")):
              rows = 0
              for n, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line.strip():
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError as exc:
                      print(f"{path}:{n}: invalid JSON: {exc}")
                      failed = True
                      continue
                  missing = required - row.keys()
                  if missing:
                      print(f"{path}:{n}: missing fields {sorted(missing)}")
                      failed = True
                  rows += 1
              print(f"{path}: {rows} case(s)")

          sys.exit("eval dataset validation failed" if failed else 0)
          PY
