name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

jobs:
  test:
    name: Offline lint, tests and deployment contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # No Azure credentials needed: the agents' domain logic imports nothing
      # from the agent framework or the Azure SDKs. That is the whole point of
      # the layering rule -- see docs/architecture.md.
      - name: Lint
        run: ruff check src tests scripts

      - name: Unit tests
        run: python -m pytest -q

      - name: Validate both agent manifests and nonempty evaluation datasets
        run: python scripts/validate_ci.py
