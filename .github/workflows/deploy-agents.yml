# Deploys both hosted agents to Azure AI Foundry.
#
# Authentication is OIDC workload identity federation -- there are no secrets in
# this repository. Setup instructions: docs/08-cicd.md
name: Deploy agents

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'azure.yaml'
      - '.github/workflows/deploy-agents.yml'
      - '.github/workflows/ci.yml'
      - 'scripts/validate_ci.py'
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Run a remote smoke invoke after deploying
        type: boolean
        default: true

concurrency:
  group: deploy-agents
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Skips cleanly instead of failing red when someone clones this repo without
  # configuring OIDC. Setup instructions: docs/08-cicd.md
  check-config:
    name: Check deployment is configured
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
        run: |
          configured=0
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ENV_NAME AZURE_LOCATION; do
            if [[ -n "${!name}" ]]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done
          if [[ "$configured" -eq 5 ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "$configured" -ne 0 ]]; then
            echo "::error::Incomplete deployment configuration. Missing: ${missing[*]}"
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment skipped"
              echo ""
              echo "Azure OIDC is not configured for this repository, so there is nothing to deploy."
              echo "Set all five \`AZURE_*\` repository variables documented in docs/08-cicd.md"
              echo "repository variables to enable it - see [docs/08-cicd.md](../blob/main/docs/08-cicd.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Validate this revision before deployment
    needs: check-config
    if: needs.check-config.outputs.configured == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Provision and deploy
    needs: [check-config, validate]
    if: needs.check-config.outputs.configured == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install azd
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: '1.33.0'

      - name: Install Foundry azd extensions
        run: |
          azd extension install microsoft.foundry --no-prompt
          azd ai agent --help

      # Federated credential -- no client secret exists anywhere.
      - name: Log in to azd (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create the azd environment in this fresh checkout
        run: |
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt

      # Idempotent: a no-op when the Foundry project and model already exist.
      - name: Provision
        run: azd provision --no-prompt

      - name: Pin the model deployment name
        run: azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME gpt-5.4-mini

      - name: Deploy both agents
        run: azd deploy --no-prompt

      - name: Health check
        run: azd ai agent doctor

      - name: Smoke test the deployed agents
        if: github.event_name != 'workflow_dispatch' || inputs.smoke_test
        run: |
          set -euo pipefail
          echo "::group::devops-triage"
          azd ai agent invoke devops-triage \
            "Checkout is returning 5xx for about 12% of requests, roughly 3000 users affected." \
            | tee triage.txt
          echo "::endgroup::"

          echo "::group::docs-qa"
          azd ai agent invoke docs-qa \
            "How long do I have to submit evidence for a Mastercard chargeback?" \
            | tee docsqa.txt
          echo "::endgroup::"

          # Fail the deploy if the agents lost their core behaviour.
          grep -qi "SEV2"        triage.txt || { echo "triage did not classify severity"; exit 1; }
          grep -qi "Payments Core" triage.txt || { echo "triage did not identify the owner"; exit 1; }
          grep -qi "21 days"     docsqa.txt || { echo "docs-qa gave an ungrounded answer"; exit 1; }
          grep -qi "Sources:"    docsqa.txt || { echo "docs-qa omitted citations"; exit 1; }

      - name: Summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Agent deployment"
            echo ""
            echo "Status: $DEPLOY_STATUS"
            echo "See the health-check and smoke-test steps for execution evidence."
          } >> "$GITHUB_STEP_SUMMARY"
