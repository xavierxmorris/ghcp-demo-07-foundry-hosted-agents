version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directories:
      - /
      - /src/devops-triage
      - /src/docs-qa
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
